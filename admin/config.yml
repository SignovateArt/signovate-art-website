backend:
  name: git-gateway
  branch: main
  commit_messages:
    create: 'Create {{collection}} "{{slug}}"'
    update: 'Update {{collection}} "{{slug}}"'
    delete: 'Delete {{collection}} "{{slug}}"'

media_folder: "images/products"
public_folder: "/images/products"

collections:
  - name: "products"
    label: "Products"
    files:
      - label: "Product list"
        name: "products"
        file: "products.json"
        fields:
          - label: "Products"
            name: "items"
            widget: "list"
            summary: "{{fields.title}}"
            fields:
              - { label: "Product name", name: "title", widget: "string" }
              - { label: "Category", name: "category", widget: "string", required: false }
              - { label: "Description", name: "description", widget: "text", required: false }
              - { label: "Photo", name: "image", widget: "image" }
              - { label: "Price", name: "price", widget: "string", required: false, hint: "Rs 15,000 — khaali chhor sakte hain" }
